about: >
  Hi, I'm <strong>Felipe Muñoz</strong> — a visionary technology leader with <strong>16+ years</strong>
  bridging deep cloud engineering and executive AI strategy. Among the first
  <strong>Google Cloud Certified Professional Cloud Architects</strong> in Latin America, holding six GCP
  professional certifications, and a hands-on builder of enterprise AI systems using
  <strong>Vertex AI, Claude (Anthropic), Gemini</strong>, and multi-agent frameworks.

  Founder of <strong>byCerebro</strong> — a production-grade agentic AI platform — and recognized for
  converting raw AI ideas into deployed enterprise applications at record speed. I operate end-to-end across
  infrastructure, DevSecOps, full-stack development, UI/UX, AI automation, and C-suite communication,
  making me the definitive bridge between <strong>disruptive AI potential and scalable business reality</strong>.

beliefs:
  - AI is not a model — it's a <strong>living, deployed system</strong>
  - Cloud is not infrastructure — it's <strong>execution capability</strong>
  - The best architecture serves the business, <strong>not the other way around</strong>
  - Speed to production is a <strong>competitive moat</strong>
  - Security and automation are <strong>non-negotiable defaults</strong>

what_i_build:
  - <strong>Enterprise AI platforms</strong> from concept to production in days, not months
  - <strong>Multi-agent architectures</strong> with Claude, Gemini, Vertex AI, and MCP
  - Secure, scalable <strong>cloud-native platforms</strong> on GCP, AWS, and Azure
  - <strong>Full-stack applications</strong> — backend, frontend, and AI-driven UX
  - <strong>DevSecOps pipelines</strong> and Zero Trust security postures
  - Executive-grade <strong>data visualization and reporting platforms</strong>


about: >
  Hola, soy <strong>Felipe Muñoz</strong> — líder tecnológico con <strong>16+ años</strong> conectando
  ingeniería cloud profunda con estrategia ejecutiva de IA. Uno de los primeros
  <strong>Google Cloud Certified Professional Cloud Architects</strong> en América Latina, con seis
  certificaciones profesionales GCP, y constructor hands-on de sistemas IA enterprise utilizando
  <strong>Vertex AI, Claude (Anthropic), Gemini</strong> y frameworks multi-agente.

  Fundador de <strong>byCerebro</strong> — una plataforma de IA agéntica en producción — reconocido por
  convertir ideas de IA en aplicaciones enterprise desplegadas a velocidad récord. Opero end-to-end en
  infraestructura, DevSecOps, desarrollo full-stack, UI/UX, automatización IA y comunicación con C-suite,
  siendo el puente definitivo entre el <strong>potencial disruptivo de la IA y la realidad empresarial escalable</strong>.

beliefs:
  - La IA no es un modelo — es un <strong>sistema vivo y desplegado</strong>
  - Cloud no es infraestructura — es <strong>capacidad de ejecución</strong>
  - La mejor arquitectura sirve al negocio, <strong>no al revés</strong>
  - La velocidad a producción es una <strong>ventaja competitiva</strong>
  - Seguridad y automatización son <strong>defaults no negociables</strong>

what_i_build:
  - <strong>Plataformas IA enterprise</strong> de concepto a producción en días, no meses
  - <strong>Arquitecturas multi-agente</strong> con Claude, Gemini, Vertex AI y MCP
  - Plataformas <strong>cloud-native</strong> seguras y escalables en GCP, AWS y Azure
  - <strong>Aplicaciones full-stack</strong> — backend, frontend e interfaces impulsadas por IA
  - <strong>Pipelines DevSecOps</strong> y posturas de seguridad Zero Trust
  - Plataformas de <strong>visualización de datos</strong> de nivel ejecutivo


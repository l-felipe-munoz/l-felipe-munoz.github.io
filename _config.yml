title: Felipe Muñoz
tagline: Director of AI Transformation · Cloud Architecture · Enterprise AI Automation
description: Visionary technology leader with 16+ years bridging deep cloud engineering and executive AI strategy. Founder of byCerebro — a production-grade agentic AI platform for enterprise automation.

# GitHub Pages (user site)
url: "https://l-felipe-munoz.github.io"
baseurl: ""

lang: en
timezone: America/Bogota

# Social preview / SEO image (used by jekyll-seo-tag for og:image / twitter:image)
logo: /assets/img/userphoto.jpg
image: /assets/img/userphoto.jpg

author:
  name: Felipe Muñoz

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false


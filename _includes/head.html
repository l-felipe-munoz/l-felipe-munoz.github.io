<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />

{% seo %}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
{% if page.layout == 'store' %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,100,1&family=Inter:wght@400;500;600&display=swap" />
{% endif %}
<link rel="icon" href="{{ '/assets/icons/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png" />
<link rel="icon" href="{{ '/assets/icons/favicon-16.png' | relative_url }}" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}" sizes="180x180" />

<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      document.documentElement.classList.remove("no-js");
    } catch (e) {}
  })();
</script>
